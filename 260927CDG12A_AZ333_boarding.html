<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蘇先生（Andy）家族｜巴黎→羅馬 登機證</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132743; --navy-deep:#0c1c30;
    --gold:#c6a15b; --gold-soft:#e8d9b5;
    --cream:#f8f5ee; --paper:#ffffff; --ink:#20242c; --muted:#707684; --line:#e6e1d6;
    --green:#3f7a52; --green-bg:#e7f1e9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 20px 48px;}

  .topbar{
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;padding:24px 20px 20px;margin-bottom:22px;
  }
  .topbar-inner{max-width:720px;margin:0 auto;}
  .eyebrow{color:var(--gold-soft);font-size:12px;letter-spacing:.04em;margin-bottom:6px;}
  h1{font-family:'Noto Serif TC', serif;font-weight:600;font-size:21px;margin:0 0 8px;}
  .flight-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:13.5px;color:#d7dee8;
  }
  .flight-badge{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);
    padding:4px 10px;border-radius:999px;font-weight:600;color:#fff;
  }
  .checkin-badge{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--green-bg);color:var(--green);
    font-size:12px;font-weight:700;
    padding:4px 10px;border-radius:999px;margin-top:10px;
  }

  .tabs{
    display:flex;gap:8px;overflow-x:auto;
    margin-bottom:20px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;
  }
  .tab{
    flex:none;
    font-family:'Noto Sans TC', sans-serif;
    font-size:13.5px;font-weight:600;
    color:var(--navy);background:#fff;
    border:1px solid var(--line);
    padding:10px 16px;border-radius:9px;
    cursor:pointer;white-space:nowrap;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab .tab-seat{font-size:11px;font-weight:500;color:var(--muted);}
  .tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .tab.active .tab-seat{color:var(--gold-soft);}
  .tab.seatmap-tab{border-style:dashed;}

  .pane{display:none;flex-direction:column;align-items:center;gap:16px;}
  .pane.active{display:flex;}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    max-width:380px;width:100%;
    box-shadow:0 8px 24px rgba(19,39,67,.08);
  }
  .card-name{
    font-family:'Noto Serif TC', serif;
    font-size:16px;font-weight:600;color:var(--navy);
    text-align:center;margin-bottom:14px;
  }
  .card img{width:100%;height:auto;display:block;border-radius:10px;}

  .qr-card{
    max-width:220px;
  }
  .qr-label{
    font-size:12px;color:var(--muted);text-align:center;
    margin-bottom:10px;line-height:1.5;
  }
  .qr-label b{color:var(--navy);}

  .seatmap-card{
    max-width:660px;
  }

  .footer-note{
    text-align:center;font-size:11.5px;color:var(--muted);
    margin-top:20px;line-height:1.6;
  }

  @media (max-width:420px){
    h1{font-size:18px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="eyebrow">FineDayClub · 專屬禮賓服務</div>
    <h1>蘇先生（Andy）家族｜巴黎 → 羅馬 登機證</h1>
    <div class="flight-row">
      <span class="flight-badge">AZ 333</span>
      <span>01OCT26 · CDG 14:05 → FCO 16:10</span>
    </div>
    <div class="checkin-badge">✓ 已完成線上 Check-in</div>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="panes"></div>

const tabsEl = document.getElementById('tabs');
const panesEl = document.getElementById('panes');

const tabButtons = PASSENGERS.map((p, i) => `
  <button class="tab ${i===0?'active':''}" data-idx="${i}">
    <span>${p.nameZh}</span>
    <span class="tab-seat">Seat ${p.seat}</span>
  </button>
`).join('') + `
  <button class="tab seatmap-tab" data-idx="seatmap">
    <span>座位圖</span>
    <span class="tab-seat">Seat Map</span>
  </button>
`;
tabsEl.innerHTML = tabButtons;

const passengerPanes = PASSENGERS.map((p, i) => `
  <div class="pane ${i===0?'active':''}" data-idx="${i}">
    <div class="card">
      <div class="card-name">${p.nameZh}　${p.nameEn}</div>
      <img src="data:image/png;base64,${p.image}" alt="${p.nameEn} boarding pass">
    </div>
    <div class="card qr-card">
      <div class="qr-label">QR Code（備用）<br><b>${p.nameZh}</b> ｜ Seat ${p.seat}</div>
      <img src="data:image/png;base64,${p.qr}" alt="${p.nameEn} QR backup">
    </div>
  </div>
`).join('');

const seatmapPane = `
  <div class="pane" data-idx="seatmap">
    <div class="card seatmap-card">
      <div class="card-name">機上座位圖</div>
      <img src="data:image/png;base64,${SEATMAP}" alt="Seat map">
    </div>
  </div>
`;

panesEl.innerHTML = passengerPanes + seatmapPane;

tabsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  const idx = btn.dataset.idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.idx === idx));
  panesEl.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.idx === idx));
});
</script>
